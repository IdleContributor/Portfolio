  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #fff;
      text-align: center;
      gap: 10px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #334155;
      border-top: 5px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 30px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #38bdf8;
      font-size: 16px;
      font-weight: 500;
    }

    .desc {
      color: #94a3b8;
      font-size: 14px;
      max-width: 500px;
    }

    .icons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .icon {
      font-size: 28px;
      color: #38bdf8;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .icon:hover {
      color: #0ea5e9;
      transform: scale(1.2);
    }
  </style>

</head>
  

<body>
