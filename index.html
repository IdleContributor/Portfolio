<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>

  <!-- LinkedIn Icon (Font Awesome CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #334155;
      border-top: 5px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
    }

    p {
      color: #94a3b8;
    }

    .linkedin {
      margin-top: 20px;
      font-size: 28px;
      color: #38bdf8;
      text-decoration: none;
      transition: 0.3s;
    }

    .linkedin:hover {
      color: #0ea5e9;
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <div class="spinner"></div>
  <h1>Coming Soon</h1>
  <p>Work in progress</p>

  <!-- LinkedIn Icon -->
  <a 
    href="https://www.linkedin.com/in/simarjot-singh-14x/" 
    target="_blank" 
    class="linkedin"
  >
    <i class="fab fa-linkedin"></i>
  </a>

</body>
</html>
